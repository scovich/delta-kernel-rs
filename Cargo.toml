[workspace]
members = [
    "acceptance",
    "derive-macros",
    "ffi",
    "kernel",
    "kernel/examples/*",
    "test-utils",
    "feature-tests",
    "mem-test",
    "uc-client", # WIP: this is an experimental UC client for catalog-managed table work
]
# Examples included in the workspace (kernel/examples/*):
# - inspect-table: Mode-agnostic, shows table metadata
# - read-table: Mode-agnostic, uses await_! for kernel calls
# - read-table-async: Async-only, uses native .await (uses required-features)
# - read-table-changes: Mode-agnostic, shows CDC functionality
# - read-table-multi-threaded: Sync-only, demonstrates OS thread parallelism
# - read-table-sync: Sync-only, demonstrates pure sync API usage
# - write-table: Mode-agnostic, shows write operations
#
# Mode-specific components:
# - Async-only (read-table-async):
#   * Uses [[bin]] with required-features = ["async"]
#   * Automatically skipped in sync workspace builds
#   * Automatically included in async workspace builds
#
# - Sync-only (ffi, read-table-multi-threaded, read-table-sync):
#   * Excluded from default-members
#   * Use compile_error! to prevent async compilation
#   * Must use --workspace to build (they're in members but not default-members)
default-members = [
    "acceptance",
    "derive-macros",
    "kernel",
    "kernel/examples/common",
    "kernel/examples/inspect-table",
    "kernel/examples/read-table",
    "kernel/examples/read-table-changes",
    "kernel/examples/write-table",
    "test-utils",
    "feature-tests",
    "mem-test",
    "uc-client",
]
resolver = "2"

# CI/Build commands:
#
# Default members (mode-agnostic components):
#   cargo build
#   cargo test --features default-engine-rustls
#   cargo build --features async
#   cargo test --features default-engine-rustls,async
#
# Full workspace (includes sync-only, which fail with async):
#   cargo build --workspace
#   cargo build --workspace --features async  # will fail on sync-only components
#
# Build mode-specific examples individually:
#   cargo build -p read-table-sync               # sync-only
#   cargo build -p read-table-multi-threaded     # sync-only
#   cargo build -p read-table-async --features async  # async-only

[workspace.package]
edition = "2021"
homepage = "https://delta.io"
keywords = ["deltalake", "delta", "datalake"]
license = "Apache-2.0"
repository = "https://github.com/delta-io/delta-kernel-rs"
readme = "README.md"
rust-version = "1.84"
version = "0.16.0"
