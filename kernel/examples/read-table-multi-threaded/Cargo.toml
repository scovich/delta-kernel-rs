[package]
name = "read-table-multi-threaded"
version = "0.1.0"
edition = "2021"
publish = false

# NOTE: This example only works in sync mode (without --features async).
# It demonstrates partitioning scan work across OS threads, which is a
# fundamentally synchronous pattern. For async examples, see read-table-single-threaded.

[features]
# Async feature - defined only to allow compile_error check
# Building with --features async will fail with a clear error message.
async = ["delta_kernel/async"]

[dependencies]
arrow = { version = "56", features = ["prettyprint", "chrono-tz"] }
clap = { version = "4.5", features = ["derive"] }
common = { path = "../common" }
delta_kernel = { path = "../../../kernel", features = [
  "arrow-56",
  "default-engine-rustls",
  "internal-api",
] }
env_logger = "0.11.8"
spmc = "0.3.0"
url = "2"

# for cargo-release
[package.metadata.release]
release = false
