[package]
name = "read-table-changes"
version = "0.1.0"
edition = "2021"
publish = false

# for cargo-release
[package.metadata.release]
release = false

[features]
# Propagate async feature from delta_kernel
async = ["delta_kernel/async", "tokio"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
common = { path = "../common" }
delta_kernel = { path = "../../../kernel", features = [
  "arrow",
  "default-engine-rustls",
  "internal-api",
] }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
